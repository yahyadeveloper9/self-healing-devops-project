---

- name: Make health-agent executable
  file:
    path: /opt/resume-platform/monitoring/scripts/health-agent.sh
    mode: '0755'

- name: Create resume-monitor systemd service
  template:
    src: resume-monitor.service.j2
    dest: /etc/systemd/system/resume-monitor.service
  notify: Restart resume-monitor

- name: Ensure resume-monitor is started and enabled
  systemd:
    name: resume-monitor
    state: restarted
    enabled: yes
    daemon_reload: yes
