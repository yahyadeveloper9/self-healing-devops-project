---
- name: Install Nginx
  package:
    name: nginx
    state: present

- name: Create Nginx configuration
  template:
    src: resume-app.conf.j2
    dest: /etc/nginx/conf.d/resume-app.conf
  notify: Restart Nginx

- name: Ensure default nginx sites are removed
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/conf.d/default.conf
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/sites-available/default
  notify: Restart Nginx

- name: Ensure Nginx is enabled and running
  systemd:
    name: nginx
    state: started
    enabled: yes
